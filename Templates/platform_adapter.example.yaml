# 平台动作适配器 · 示例模板
# 用途：把内部 ApprovalEnvelope 映射成平台 HTTP 请求。
# 校验：python -m runtime resume <id> --decision approve --apply-adapter <本文件>
# 注意：以下 URL/字段是占位示例，必须按目标平台官方 API 文档替换后再使用。

name: "shopee-example"
base_url: "https://api.example.com"       # 替换为平台 API 根地址
timeout: 30

headers:
  Content-Type: "application/json"

auth:
  type: "bearer"                          # bearer | header | none
  token_env: "SHOPEE_ACCESS_TOKEN"        # 从环境变量读取，不写死在文件里

actions:
  # 广告出价
  ad.set_bid:
    method: "POST"
    path: "/ads/campaigns/{target}/bid"   # {target} 会做 URL 编码
    body:
      campaign_id: "{target}"
      bid: "{after.cpc}"                  # 整个变量保留数字类型
      reason: "{reason}"

  # 广告预算
  ad.set_budget:
    method: "POST"
    path: "/ads/campaigns/{target}/budget"
    body:
      campaign_id: "{target}"
      budget: "{after.budget}"

  # 改价
  product.update_price:
    method: "PUT"
    path: "/items/{target}/price"
    body:
      price: "{after.price}"

  # 改标题
  listing.update_title:
    method: "PUT"
    path: "/items/{target}/title"
    body:
      title: "{after.title}"

  # 换主图
  image.replace_main:
    method: "POST"
    path: "/items/{target}/images/main"
    body:
      image: "{after.image}"
