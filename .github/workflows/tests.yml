name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: runtime
          POSTGRES_PASSWORD: runtime
          POSTGRES_DB: runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U runtime -d runtime"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cross-border-ecommerce-api/requirements.txt

      - name: Runtime tests (with Postgres integration)
        env:
          RUNTIME_TEST_POSTGRES_URL: postgresql+psycopg://runtime:runtime@127.0.0.1:5432/runtime
          RUNTIME_TEST_POSTGRES_DSN: postgresql://runtime:runtime@127.0.0.1:5432/runtime
        run: python -m unittest discover -s runtime/tests -v

      - name: 04 image render self-test
        run: python Agents/04_Product_Image_Agent/tests/test_render.py

      - name: CLI smoke
        env:
          RUNTIME_TEST_DB: /tmp/runtime-smoke.db
        run: |
          python -m runtime run "帮我看下巴西站滑板车类目的市场容量和价格带" --db "$RUNTIME_TEST_DB"
          python -m runtime eval Templates/eval_case.yaml

      - name: Compose config
        run: |
          docker compose -f cross-border-ecommerce-api/docker-compose.yml config >/dev/null
          docker compose -f cross-border-ecommerce-api/docker-compose.yml -f cross-border-ecommerce-api/docker-compose.prod.yml config >/dev/null

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -f cross-border-ecommerce-api/Dockerfile -t runtime:test .

      - name: Runtime container self-check
        run: docker run --rm runtime:test python -m runtime doctor
